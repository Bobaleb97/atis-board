<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ATIS Board</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0a0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATIS Board">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #0a0d12;
    --panel: #11161d;
    --panel-border: #232b36;
    --text: #e6e9ee;
    --text-dim: #8a93a1;
    --amber: #f5a623;
    --amber-text: #1a1206;
    --blue: #3b82f6;
    --blue-text: #06101f;
    --gray: #6b7280;
    --gray-text: #0d0f12;
    --accent: #2dd4bf;
    --star: #fbbf24;
    --danger: #ef4444;
    --ai: #a78bfa;
    --ai-text: #1c1333;
    font-family: "SF Mono", "IBM Plex Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--panel-border);
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 {
    font-size: 18px;
    letter-spacing: 2px;
    margin: 0;
    text-transform: uppercase;
    color: var(--text);
  }
  h1 span { color: var(--accent); }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .toggle {
    display: flex;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    overflow: hidden;
  }
  .toggle button {
    background: var(--panel);
    color: var(--text-dim);
    border: none;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    white-space: nowrap;
  }
  .toggle button.active {
    background: var(--accent);
    color: #04201c;
  }
  .icon-btn {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
  }
  .icon-btn:hover { color: var(--text); }
  .banner {
    background: #241a0a;
    border-bottom: 1px solid #5a3a10;
    color: #f5c877;
    padding: 10px 20px;
    font-size: 13px;
    display: none;
  }
  .banner.show { display: block; }
  .settings {
    display: none;
    padding: 16px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-border);
    gap: 14px;
    flex-wrap: wrap;
  }
  .settings.show { display: flex; }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 220px;
  }
  .field label {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .field input[type="text"] {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    width: 100%;
  }
  .field.checkbox {
    flex-direction: row;
    align-items: center;
    gap: 8px;
  }
  .field.actions {
    flex-direction: row;
    align-items: flex-end;
  }
  .field.wide { flex-basis: 100%; }
  .save-btn {
    background: var(--accent);
    color: #04201c;
    border: none;
    padding: 9px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    height: 35px;
    white-space: nowrap;
  }
  .lookup-row {
    display: flex;
    gap: 8px;
  }
  .lookup-row input { flex: 1; }
  .lookup-result { margin-top: 10px; }
  .settings-hint {
    font-size: 11px;
    color: var(--text-dim);
    margin: -4px 0 0 0;
    flex-basis: 100%;
  }
  main {
    padding: 20px;
  }
  .hidden { display: none !important; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 14px;
  }
  .airport-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    overflow: hidden;
  }
  .airport-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 12px;
    background: #0d1219;
    border-bottom: 1px solid var(--panel-border);
    gap: 10px;
  }
  .airport-head .icao {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
  }
  .airport-head .count {
    font-size: 11px;
    color: var(--text-dim);
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .star-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 15px;
    padding: 0;
    margin-right: 8px;
    line-height: 1;
  }
  .star-btn.active { color: var(--star); }
  .strip {
    display: flex;
    border-bottom: 1px solid var(--panel-border);
  }
  .strip:last-child { border-bottom: none; }
  .letter-box {
    flex: 0 0 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: bold;
    transition: box-shadow 0.3s ease;
  }
  .letter-box.arrival { background: var(--amber); color: var(--amber-text); }
  .letter-box.departure { background: var(--blue); color: var(--blue-text); }
  .letter-box.combined { background: var(--gray); color: var(--gray-text); }
  .letter-box.ai { background: var(--ai); color: var(--ai-text); }
  .letter-box .type-tag {
    font-size: 9px;
    letter-spacing: 1px;
    font-weight: normal;
    margin-top: 2px;
  }
  .letter-box.flash {
    box-shadow: 0 0 0 3px #fff inset, 0 0 14px 2px #fff;
  }
  .strip-body {
    flex: 1;
    padding: 8px 12px;
    min-width: 0;
  }
  .strip-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .change-note {
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .strip-text {
    font-size: 12px;
    line-height: 1.5;
    color: var(--text);
    max-height: 90px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .metar-block {
    padding: 8px 12px;
    border-top: 1px solid var(--panel-border);
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .metar-block .metar-text {
    color: var(--text);
    font-size: 12px;
    text-transform: none;
    letter-spacing: normal;
    margin-top: 4px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 13px;
  }
  .flight-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }
  #flightUserLabel {
    font-size: 12px;
    color: var(--text-dim);
  }
  .flight-summary {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
  }
  .flight-summary .item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .flight-summary .item .label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .flight-summary .item .value {
    font-size: 14px;
  }
  .clickable-strip { cursor: pointer; }
  .clickable-strip:hover { background: rgba(255,255,255,0.03); }
  .detail-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 50;
    overflow-y: auto;
    display: none;
  }
  .detail-overlay.show { display: block; }
  .detail-header {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--panel-border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 2;
  }
  .detail-header .detail-icao {
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .detail-header .spacer { flex: 1; }
  .detail-body {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 900px;
    margin: 0 auto;
  }
  .detail-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 16px;
  }
  .detail-panel h3 {
    margin: 0 0 12px 0;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .wx-top {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    align-items: center;
    margin-bottom: 14px;
  }
  .wx-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 1px;
  }
  .wx-badge.vfr { background: #22c55e; color: #06240f; }
  .wx-badge.mvfr { background: #3b82f6; color: #06101f; }
  .wx-badge.ifr { background: #ef4444; color: #2b0505; }
  .wx-badge.lifr { background: #d946ef; color: #280a2b; }
  .wx-badge.unknown { background: var(--gray); color: var(--gray-text); }
  .wind-compass-wrap { display: flex; align-items: center; gap: 14px; }
  .wx-stats { display: flex; flex-wrap: wrap; gap: 20px; }
  .wx-stats .item { display: flex; flex-direction: column; gap: 4px; }
  .wx-stats .item .label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .wx-stats .item .value { font-size: 14px; }
  .cloud-rows { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .cloud-row { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-dim); }
  .cloud-bar-track { flex: 1; background: #0d1219; border-radius: 3px; height: 10px; overflow: hidden; }
  .cloud-bar-fill { height: 100%; background: var(--accent); }
  .wx-chips, .runway-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .chip {
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    border: 1px solid var(--panel-border);
    background: #0d1219;
  }
  .runway-group .glabel {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-right: 4px;
  }
  .notam-list { display: flex; flex-direction: column; gap: 10px; }
  .notam-item { display: flex; gap: 10px; align-items: flex-start; font-size: 12px; line-height: 1.5; }
  .notam-dot { flex: 0 0 10px; width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; }
  .notam-dot.high { background: var(--danger); }
  .notam-dot.mid { background: var(--star); }
  .notam-dot.low { background: var(--text-dim); }
  .controller-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--panel-border);
    font-size: 12px;
    gap: 10px;
  }
  .controller-row:last-child { border-bottom: none; }
  .controller-pos { font-weight: bold; color: var(--accent); }
  footer {
    padding: 10px 20px;
    color: var(--text-dim);
    font-size: 11px;
    border-top: 1px solid var(--panel-border);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  footer button {
    background: none;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
  }
  footer button:hover { color: var(--text); }
</style>
</head>
<body>

<header>
  <h1>ATIS <span>BOARD</span></h1>
  <div class="controls">
    <div class="toggle" id="viewToggle">
      <button data-view="dashboard">DASHBOARD</button>
      <button data-view="flight">CURRENT FLIGHT</button>
      <button data-view="sayintentions">SAYINTENTIONS</button>
    </div>
    <div class="toggle" id="sourceToggle">
      <button data-source="realworld">REAL WORLD</button>
      <button data-source="vatsim">VATSIM</button>
    </div>
    <button class="icon-btn" id="refreshBtn">REFRESH</button>
    <button class="icon-btn" id="settingsBtn">SETTINGS</button>
  </div>
</header>

<div class="banner" id="banner"></div>

<div class="settings" id="settingsPanel">
  <div class="field">
    <label for="airportInput">Airports (ICAO, comma separated)</label>
    <input type="text" id="airportInput" placeholder="KLAX, KSNA, KSAN, KSFO, KLAS">
  </div>
  <div class="field">
    <label for="starredInput">Starred (shown first)</label>
    <input type="text" id="starredInput" placeholder="KLAX, KSFO">
  </div>
  <div class="field checkbox">
    <input type="checkbox" id="showAllInput">
    <label for="showAllInput" style="text-transform:none;letter-spacing:0;">Show all airports</label>
  </div>
  <div class="field">
    <label for="simbriefInput">SimBrief username / pilot ID</label>
    <input type="text" id="simbriefInput" placeholder="your SimBrief username">
  </div>
  <div class="field">
    <label for="proxyInput">CORS proxy prefix (optional)</label>
    <input type="text" id="proxyInput" placeholder="https://your-worker.workers.dev/?url=">
  </div>
  <div class="field">
    <label for="siDevKeyInput">SayIntentions Developer Key</label>
    <input type="password" autocomplete="off" id="siDevKeyInput" placeholder="pk_...">
  </div>
  <div class="field">
    <label for="siApiKeyInput">SayIntentions API Key (your pilot account)</label>
    <input type="password" autocomplete="off" id="siApiKeyInput" placeholder="from portal.sayintentions.ai">
  </div>
  <div class="field actions">
    <button class="save-btn" id="saveSettingsBtn">SAVE &amp; CLOSE</button>
  </div>

  <div class="field wide">
    <label for="lookupInput">Field lookup — D-ATIS &amp; METAR for any airport</label>
    <div class="lookup-row">
      <input type="text" id="lookupInput" placeholder="e.g. KORD">
      <button class="save-btn" id="lookupBtn" type="button">LOOK UP</button>
    </div>
    <div id="lookupResult" class="lookup-result"></div>
  </div>
</div>

<main>
  <section id="dashboardSection">
    <div id="grid" class="grid"></div>
  </section>
  <section id="flightSection" class="hidden">
    <div class="flight-controls">
      <span id="flightUserLabel"></span>
      <button class="icon-btn" id="loadFlightBtn">LOAD FLIGHT</button>
    </div>
    <div id="flightContent">
      <div class="empty-state">Set your SimBrief username in Settings, then click Load Flight.</div>
    </div>
  </section>
  <section id="sayintentionsSection" class="hidden">
    <p class="settings-hint" style="margin-bottom:14px;">AI-generated ATC data from SayIntentions.AI — not real-world ATIS. Uses your Airports list from Settings.</p>
    <div id="siGrid" class="grid"></div>
  </section>
</main>

<footer>
  <span id="statusLine">Loading…</span>
  <button id="manualRefresh">Refresh now</button>
</footer>

<div class="detail-overlay" id="airportDetailOverlay">
  <div class="detail-header">
    <button class="icon-btn" id="detailBackBtn">← BACK</button>
    <span class="detail-icao" id="detailTitle"></span>
    <span class="spacer"></span>
    <button class="icon-btn" id="detailRefreshBtn">REFRESH</button>
  </div>
  <div id="detailContent"></div>
</div>

<script>
(() => {
  const STORAGE_SETTINGS = 'atisBoard.settings';
  const STORAGE_PREV_CODES = 'atisBoard.prevCodes';

  const DEFAULT_SETTINGS = {
    source: 'realworld',
    view: 'dashboard',
    airports: ['KLAX', 'KSNA', 'KSAN', 'KSFO', 'KLAS'],
    starred: [],
    showAll: false,
    proxy: '',
    simbriefUser: '',
    siDevKey: '',
    siApiKey: ''
  };

  const REALWORLD_ALL_URL = 'https://atis.info/api/all';
  const REALWORLD_FIELD_URL = 'https://atis.info/api/';
  const VATSIM_URL = 'https://data.vatsim.net/v3/vatsim-data.json';
  const METAR_URL = 'https://metar.vatsim.net/';
  const SIMBRIEF_URL = 'https://www.simbrief.com/api/xml.fetcher.php';
  const SAYINTENTIONS_URL = 'https://apipri.sayintentions.ai/sapi/getWX';
  const REALWORLD_INTERVAL = 2 * 60 * 1000;
  const VATSIM_INTERVAL = 30 * 1000;
  const SAYINTENTIONS_INTERVAL = 2 * 60 * 1000;

  const SAMPLE_DATA = {
    realworld: [
      { icao: 'KLAX', type: 'combined', code: 'R', text: 'LAX ATIS INFO R (SAMPLE DATA — live feed unavailable). 24013KT 10SM SCT015 BKN034 20/13 A2997. ADVS YOU HAVE INFO R.', updated: new Date().toISOString() },
      { icao: 'KSFO', type: 'arrival', code: 'J', text: 'SFO ARR ATIS INFO J (SAMPLE DATA). VISUAL APPROACH RWY 28L/28R IN USE. ADVS YOU HAVE INFO J.', updated: new Date().toISOString() },
      { icao: 'KSFO', type: 'departure', code: 'K', text: 'SFO DEP ATIS INFO K (SAMPLE DATA). DEPARTING RWY 1L/1R. ADVS YOU HAVE INFO K.', updated: new Date().toISOString() },
      { icao: 'KLAS', type: 'combined', code: 'C', text: 'LAS ATIS INFO C (SAMPLE DATA). WIND CALM. ADVS YOU HAVE INFO C.', updated: new Date().toISOString() }
    ],
    vatsim: [
      { icao: 'KLAX', type: 'combined', code: 'A', text: 'LAX ATIS INFO A (SAMPLE VATSIM DATA — live feed unavailable). ADVS YOU HAVE INFO A.', updated: new Date().toISOString() },
      { icao: 'KJFK', type: 'arrival', code: 'B', text: 'JFK ARR ATIS INFO B (SAMPLE VATSIM DATA). ADVS YOU HAVE INFO B.', updated: new Date().toISOString() }
    ]
  };

  let settings = loadSettings();
  let prevCodes = loadPrevCodes();
  let timer = null;
  let lastFetchAt = null;
  let lastDashboardEntries = [];
  let lastSiEntries = [];
  let flightState = { data: null };
  let detailState = { icao: null };

  function loadSettings() {
    try {
      const raw = localStorage.getItem(STORAGE_SETTINGS);
      if (!raw) return { ...DEFAULT_SETTINGS };
      const parsed = JSON.parse(raw);
      return { ...DEFAULT_SETTINGS, ...parsed };
    } catch (e) {
      return { ...DEFAULT_SETTINGS };
    }
  }

  function saveSettings() {
    try { localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(settings)); } catch (e) {}
  }

  function loadPrevCodes() {
    try {
      const raw = localStorage.getItem(STORAGE_PREV_CODES);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }

  function savePrevCodes() {
    try { localStorage.setItem(STORAGE_PREV_CODES, JSON.stringify(prevCodes)); } catch (e) {}
  }

  function buildUrl(url) {
    if (!settings.proxy) return url;
    return settings.proxy + encodeURIComponent(url);
  }

  async function fetchRealWorld() {
    const res = await fetch(buildUrl(REALWORLD_ALL_URL), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    return data.map(d => ({
      icao: d.airport,
      type: normalizeType(d.type),
      code: d.code || '-',
      text: d.datis || '',
      updated: d.updatedAt
    }));
  }

  async function fetchVatsim() {
    const res = await fetch(buildUrl(VATSIM_URL), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const atis = data.atis || [];
    return atis.map(a => {
      const parts = (a.callsign || '').split('_');
      const icao = parts[0] || '????';
      let type = 'combined';
      if (parts[1] === 'A') type = 'arrival';
      else if (parts[1] === 'D') type = 'departure';
      return {
        icao,
        type,
        code: a.atis_code || '-',
        text: (a.text_atis || []).join(' '),
        updated: a.last_updated
      };
    });
  }

  async function fetchVatsimControllers(icao) {
    const res = await fetch(buildUrl(VATSIM_URL), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const up = icao.toUpperCase();
    const prefixes = [up + '_'];
    if (up.length === 4 && up[0] === 'K') prefixes.push(up.slice(1) + '_'); // US facilities often drop the leading K
    return (data.controllers || [])
      .filter(c => prefixes.some(p => (c.callsign || '').toUpperCase().startsWith(p)))
      .map(c => {
        const parts = c.callsign.split('_');
        return { callsign: c.callsign, position: parts[parts.length - 1], freq: c.frequency, name: c.name, logon: c.logon_time };
      });
  }

  async function fetchAtisForIcaos(icaos, source) {
    const wanted = Array.from(new Set(icaos.filter(Boolean).map(s => s.toUpperCase())));
    const map = {};
    if (!wanted.length) return map;
    if (source === 'vatsim') {
      const all = await fetchVatsim();
      all.forEach(e => {
        if (wanted.includes(e.icao.toUpperCase())) (map[e.icao] = map[e.icao] || []).push(e);
      });
      return map;
    }
    await Promise.all(wanted.map(async icao => {
      try {
        const res = await fetch(buildUrl(REALWORLD_FIELD_URL + icao), { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        if (Array.isArray(data)) {
          data.forEach(d => {
            const entry = { icao: d.airport, type: normalizeType(d.type), code: d.code || '-', text: d.datis || '', updated: d.updatedAt };
            (map[entry.icao] = map[entry.icao] || []).push(entry);
          });
        }
      } catch (e) { /* single-field failure ignored */ }
    }));
    return map;
  }

  async function fetchMetar(icaos) {
    const list = Array.from(new Set(icaos.filter(Boolean).map(s => s.toUpperCase())));
    if (!list.length) return {};
    const res = await fetch(buildUrl(METAR_URL + list.join(',')), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text();
    const map = {};
    txt.split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
      const icao = line.split(' ')[0];
      map[icao] = line;
    });
    return map;
  }

  async function fetchSayIntentions(icaos) {
    const list = Array.from(new Set(icaos.filter(Boolean).map(s => s.toUpperCase())));
    if (!list.length) return [];
    if (!settings.siApiKey) throw new Error('Set your SayIntentions API Key in Settings');
    const url = SAYINTENTIONS_URL + '?icao=' + encodeURIComponent(list.join(',')) + '&with_comms=1&api_key=' + encodeURIComponent(settings.siApiKey);
    const headers = settings.siDevKey ? { 'X-Developer-Key': settings.siDevKey } : {};
    const res = await fetch(buildUrl(url), { cache: 'no-store', headers });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const comms = data.comms || [];
    return (data.airports || []).map(a => ({
      icao: a.airport,
      code: a.current || '-',
      atis: a.atis || a.atis_cpdlc || '',
      metar: a.metar || '',
      taf: a.taf || '',
      comms: comms.filter(c => c.airport === a.airport)
    }));
  }

  async function fetchSimbrief(username) {
    const url = SIMBRIEF_URL + '?username=' + encodeURIComponent(username) + '&json=1';
    const res = await fetch(buildUrl(url), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const status = data.fetch && data.fetch.status;
    if (status !== 'Success') throw new Error(status || 'Unknown error fetching flight plan');
    return data;
  }

  function normalizeType(t) {
    if (t === 'arrival' || t === 'departure' || t === 'combined') return t;
    return 'combined';
  }

  function typeLabel(t) {
    if (t === 'arrival') return 'ARR';
    if (t === 'departure') return 'DEP';
    return 'ATIS';
  }

  function timeAgo(iso) {
    if (!iso) return '';
    const diffMs = Date.now() - new Date(iso).getTime();
    if (isNaN(diffMs)) return '';
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins === 1) return '1 min ago';
    if (mins < 60) return mins + ' min ago';
    const hrs = Math.floor(mins / 60);
    return hrs + 'h ' + (mins % 60) + 'm ago';
  }

  function formatZulu(sec) {
    if (!sec) return '—';
    const dt = new Date(sec * 1000);
    const hh = String(dt.getUTCHours()).padStart(2, '0');
    const mm = String(dt.getUTCMinutes()).padStart(2, '0');
    return hh + mm + 'Z';
  }

  const CONTROLLER_LABELS = { DEL: 'Clearance Delivery', GND: 'Ground', TWR: 'Tower', APP: 'Approach', DEP: 'Departure', CTR: 'Center', FSS: 'Flight Service', RDO: 'Radio' };
  const COVER_PCT = { FEW: 25, SCT: 50, BKN: 75, OVC: 100, VV: 100 };
  const WX_DESC = { VC: 'Vicinity', MI: 'Shallow', PR: 'Partial', BC: 'Patches', DR: 'Low Drifting', BL: 'Blowing', SH: 'Showers', TS: 'Thunderstorm', FZ: 'Freezing' };
  const WX_PHENOM = { DZ: 'Drizzle', RA: 'Rain', SN: 'Snow', SG: 'Snow Grains', IC: 'Ice Crystals', PL: 'Ice Pellets', GR: 'Hail', GS: 'Small Hail', UP: 'Unknown Precip', BR: 'Mist', FG: 'Fog', FU: 'Smoke', VA: 'Volcanic Ash', DU: 'Dust', SA: 'Sand', HZ: 'Haze', PY: 'Spray', PO: 'Dust Whirls', SQ: 'Squall', FC: 'Funnel Cloud', SS: 'Sandstorm', DS: 'Duststorm', NSW: 'No Significant Weather' };
  const NOTAM_HIGH_KEYWORDS = ['CLSD', 'CLOSED', 'OTS', 'UNSAFE', 'INCURSION', 'UNSERVICEABLE'];
  const NOTAM_MID_KEYWORDS = ['CAUTION', 'BIRD ACTIVITY', 'CRANE', 'CONST', 'DRONE ACTIVITY', 'DELAYS', 'LASER ACTIVITY', 'DEGRADED', 'DISRUPTION'];
  const NOTAM_SKIP_PATTERNS = [
    /^\d{3,4}Z\.?$/,
    /ADVS (ON|YOU)/i,
    /\d{3}\d{2,3}(G\d{2,3})?KT\b.*\bA\d{3,4}\b/,
    /APCHE?S? IN USE|APPROACHE?S? IN USE|ILS RY|ILS RWY|LANDING RWY|LANDING RUNWAY|ARVG RWY|ARRIVING RWY|DEPG RWY|DEPARTING RWY|DPTG RWY/i
  ];

  function onlineDuration(logonIso) {
    if (!logonIso) return '';
    const ms = Date.now() - new Date(logonIso).getTime();
    if (isNaN(ms) || ms < 0) return '';
    const mins = Math.floor(ms / 60000);
    const h = Math.floor(mins / 60), m = mins % 60;
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  }

  function describeWx(code) {
    let s = code, intensity = '';
    if (s[0] === '-') { intensity = 'Light'; s = s.slice(1); }
    else if (s[0] === '+') { intensity = 'Heavy'; s = s.slice(1); }
    const groups = s.match(/.{2}/g) || [s];
    const desc = groups.map(g => WX_DESC[g] || WX_PHENOM[g] || g);
    return [intensity, ...desc].filter(Boolean).join(' ');
  }

  function parseMetar(raw) {
    if (!raw) return null;
    const tokens = raw.trim().split(/\s+/);
    const m = {
      windDir: null, windVariable: false, windSpeed: null, windGust: null,
      visibilitySm: null, visibilityRaw: null, weather: [], clouds: [], skyClear: false,
      tempC: null, dewpointC: null, altimeterInHg: null, altimeterQnh: null
    };
    let i = 0;
    if (tokens[i] && /^[A-Z]{4}$/.test(tokens[i])) i++;
    if (tokens[i] && /^\d{6}Z$/.test(tokens[i])) i++;
    while (tokens[i] === 'AUTO' || tokens[i] === 'COR') i++;

    if (tokens[i] && /^(\d{3}|VRB)\d{2,3}(G\d{2,3})?KT$/.test(tokens[i])) {
      const mm = tokens[i].match(/^(\d{3}|VRB)(\d{2,3})(G(\d{2,3}))?KT$/);
      m.windVariable = mm[1] === 'VRB';
      m.windDir = m.windVariable ? null : parseInt(mm[1], 10);
      m.windSpeed = parseInt(mm[2], 10);
      m.windGust = mm[4] ? parseInt(mm[4], 10) : null;
      i++;
      if (tokens[i] && /^\d{3}V\d{3}$/.test(tokens[i])) i++;
    }

    if (tokens[i] === 'CAVOK') { m.visibilitySm = 10; m.visibilityRaw = 'CAVOK'; i++; }
    else if (tokens[i] && /^\d+$/.test(tokens[i]) && tokens[i + 1] && /^\d\/\dSM$/.test(tokens[i + 1])) {
      const whole = parseInt(tokens[i], 10);
      const frac = tokens[i + 1].match(/^(\d)\/(\d)SM$/);
      m.visibilitySm = whole + parseInt(frac[1], 10) / parseInt(frac[2], 10);
      m.visibilityRaw = tokens[i] + ' ' + tokens[i + 1];
      i += 2;
    } else if (tokens[i] && /^M?P?\d+(\/\d)?SM$/.test(tokens[i])) {
      const t = tokens[i];
      const frac = t.match(/^M?P?(\d)\/(\d)SM$/);
      if (frac) m.visibilitySm = parseInt(frac[1], 10) / parseInt(frac[2], 10);
      else { const num = t.match(/(\d+)SM$/); m.visibilitySm = num ? parseInt(num[1], 10) : null; }
      m.visibilityRaw = t;
      i++;
    } else if (tokens[i] && /^\d{4}$/.test(tokens[i])) {
      const meters = parseInt(tokens[i], 10);
      m.visibilitySm = meters >= 9999 ? 10 : Math.round((meters / 1609.34) * 10) / 10;
      m.visibilityRaw = tokens[i] + 'm';
      i++;
    }

    while (tokens[i] && /^R\d{2}[LRC]?\//.test(tokens[i])) i++;

    const wxRe = /^[-+]?(VC)?(MI|PR|BC|DR|BL|SH|TS|FZ)?(DZ|RA|SN|SG|IC|PL|GR|GS|UP|BR|FG|FU|VA|DU|SA|HZ|PY|PO|SQ|FC|SS|DS|NSW)+$/;
    while (tokens[i] && tokens[i] !== 'CLR' && wxRe.test(tokens[i])) { m.weather.push(tokens[i]); i++; }

    while (tokens[i] && /^(FEW|SCT|BKN|OVC|VV)(\d{3})(CB|TCU)?$/.test(tokens[i])) {
      const mm = tokens[i].match(/^(FEW|SCT|BKN|OVC|VV)(\d{3})(CB|TCU)?$/);
      m.clouds.push({ cover: mm[1], heightFt: parseInt(mm[2], 10) * 100, modifier: mm[3] || null });
      i++;
    }
    if (['SKC', 'CLR', 'NCD', 'NSC'].includes(tokens[i])) { m.skyClear = true; i++; }

    if (tokens[i] && /^M?\d{2}\/M?\d{2}$/.test(tokens[i])) {
      const mm = tokens[i].match(/^(M?\d{2})\/(M?\d{2})$/);
      m.tempC = parseInt(mm[1].replace('M', '-'), 10);
      m.dewpointC = parseInt(mm[2].replace('M', '-'), 10);
      i++;
    }

    if (tokens[i] && /^A\d{4}$/.test(tokens[i])) { m.altimeterInHg = parseInt(tokens[i].slice(1), 10) / 100; i++; }
    else if (tokens[i] && /^Q\d{4}$/.test(tokens[i])) { m.altimeterQnh = parseInt(tokens[i].slice(1), 10); i++; }

    let ceiling = null;
    for (const c of m.clouds) {
      if ((c.cover === 'BKN' || c.cover === 'OVC' || c.cover === 'VV') && (ceiling === null || c.heightFt < ceiling)) ceiling = c.heightFt;
    }
    m.ceilingFt = ceiling;
    if (m.visibilitySm == null && ceiling == null) m.flightCategory = 'unknown';
    else {
      const v = m.visibilitySm == null ? 10 : m.visibilitySm;
      const c = ceiling == null ? 99999 : ceiling;
      if (v < 1 || c < 500) m.flightCategory = 'lifr';
      else if (v < 3 || c < 1000) m.flightCategory = 'ifr';
      else if (v <= 5 || c <= 3000) m.flightCategory = 'mvfr';
      else m.flightCategory = 'vfr';
    }
    return m;
  }

  function windCompassSvg(m) {
    const size = 100, c = size / 2;
    const hasWind = m.windSpeed != null && m.windSpeed > 0 && !m.windVariable;
    const dirDeg = m.windDir || 0;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${c}" cy="${c}" r="${c - 6}" fill="none" stroke="var(--panel-border)" stroke-width="2"/>
      <text x="${c}" y="13" text-anchor="middle" font-size="9" fill="var(--text-dim)">N</text>
      <text x="${size - 7}" y="${c + 3}" text-anchor="middle" font-size="9" fill="var(--text-dim)">E</text>
      <text x="${c}" y="${size - 3}" text-anchor="middle" font-size="9" fill="var(--text-dim)">S</text>
      <text x="7" y="${c + 3}" text-anchor="middle" font-size="9" fill="var(--text-dim)">W</text>
      ${hasWind
        ? `<g transform="rotate(${dirDeg} ${c} ${c})">
            <line x1="${c}" y1="${c}" x2="${c}" y2="16" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
            <polygon points="${c - 6},24 ${c + 6},24 ${c},10" fill="var(--accent)"/>
          </g>`
        : `<circle cx="${c}" cy="${c}" r="4" fill="var(--text-dim)"/>`}
    </svg>`;
  }

  function parseRunways(text) {
    const arriving = new Set(), departing = new Set();
    if (!text) return { arriving: [], departing: [] };
    const addTokens = (str, set) => {
      if (!str) return;
      str.split(/,| AND /i).forEach(tok => {
        const mm = tok.trim().match(/\b(\d{1,2}[LRC]?)\b/);
        if (mm) set.add(mm[1]);
      });
    };
    let mm;
    if ((mm = text.match(/LANDING AND DEPARTING RUNWAYS?\s*([0-9A-Z, ]+?)(?:\.|$)/i))) {
      addTokens(mm[1], arriving); addTokens(mm[1], departing);
    }
    [/ARVG RWYS?\s*([0-9A-Z, ]+?)(?:\.|$)/i, /ARRIVING RWYS?\s*([0-9A-Z, ]+?)(?:\.|$)/i,
      /LANDING RWYS?\s*([0-9A-Z, ]+?)(?:\.|$)/i, /LANDING RUNWAYS?\s*([0-9A-Z, ]+?)(?:\.|,| LOCALIZER| ILS| RNAV|$)/i
    ].forEach(re => { if ((mm = text.match(re))) addTokens(mm[1], arriving); });
    [/DPTG RWYS?\s*([0-9A-Z, ]+?)(?:\.|$)/i, /DEPARTING RWYS?\s*([0-9A-Z, ]+?)(?:\.|$)/i,
      /DEPG RWYS?,?\s*([0-9A-Z, ]+?)(?:\.|$)/i
    ].forEach(re => { if ((mm = text.match(re))) addTokens(mm[1], departing); });
    return { arriving: Array.from(arriving), departing: Array.from(departing) };
  }

  function classifyNotams(text) {
    if (!text) return [];
    const sentences = text.split(/(?<=\.)\s+/).map(s => s.trim()).filter(s => s.length > 3);
    const body = sentences.slice(1); // first sentence is always the airport/info-letter header
    const items = [];
    for (const s of body) {
      if (NOTAM_SKIP_PATTERNS.some(re => re.test(s))) continue;
      const upper = s.toUpperCase();
      let severity = 'low';
      if (NOTAM_HIGH_KEYWORDS.some(k => upper.includes(k))) severity = 'high';
      else if (NOTAM_MID_KEYWORDS.some(k => upper.includes(k))) severity = 'mid';
      items.push({ text: s.replace(/\.$/, ''), severity });
    }
    const order = { high: 0, mid: 1, low: 2 };
    items.sort((a, b) => order[a.severity] - order[b.severity]);
    return items;
  }

  function showBanner(msg) {
    const el = document.getElementById('banner');
    el.textContent = msg;
    el.classList.add('show');
  }

  function hideBanner() {
    document.getElementById('banner').classList.remove('show');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function setStatus(msg) {
    document.getElementById('statusLine').textContent = msg;
  }

  function starredSet() {
    return new Set(settings.starred.map(s => s.toUpperCase()));
  }

  function filterEntries(entries) {
    if (settings.showAll) return entries;
    const wanted = new Set(settings.airports.map(a => a.trim().toUpperCase()).filter(Boolean));
    if (wanted.size === 0) return entries;
    return entries.filter(e => wanted.has(e.icao.toUpperCase()));
  }

  function groupByAirport(entries) {
    const order = [];
    const map = new Map();
    for (const e of entries) {
      if (!map.has(e.icao)) {
        map.set(e.icao, []);
        order.push(e.icao);
      }
      map.get(e.icao).push(e);
    }
    const stars = starredSet();
    order.sort((a, b) => {
      const as = stars.has(a.toUpperCase()) ? 0 : 1;
      const bs = stars.has(b.toUpperCase()) ? 0 : 1;
      if (as !== bs) return as - bs;
      return a.localeCompare(b);
    });
    const typeOrder = { arrival: 0, departure: 1, combined: 2 };
    for (const icao of order) {
      map.get(icao).sort((a, b) => (typeOrder[a.type] ?? 3) - (typeOrder[b.type] ?? 3));
    }
    return order.map(icao => ({ icao, entries: map.get(icao) }));
  }

  function render(entries) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const filtered = filterEntries(entries);
    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty-state">No ATIS entries match your airport list. Check Settings, or enable "Show all".</div>';
      return;
    }
    const groups = groupByAirport(filtered);
    const stars = starredSet();

    for (const group of groups) {
      const card = document.createElement('div');
      card.className = 'airport-card';
      card.dataset.icao = group.icao;

      const isStarred = stars.has(group.icao.toUpperCase());
      const head = document.createElement('div');
      head.className = 'airport-head';
      head.innerHTML = `<span class="icao"><button class="star-btn ${isStarred ? 'active' : ''}" data-icao="${escapeHtml(group.icao)}" title="${isStarred ? 'Unstar' : 'Star'}">${isStarred ? '★' : '☆'}</button>${escapeHtml(group.icao)}</span><span class="count">${group.entries.length} active</span>`;
      card.appendChild(head);

      for (const entry of group.entries) {
        const key = settings.source + '|' + group.icao + '|' + entry.type;
        const prevCode = prevCodes[key];
        const changed = prevCode && prevCode !== entry.code;

        const strip = document.createElement('div');
        strip.className = 'strip clickable-strip';

        const letterBox = document.createElement('div');
        letterBox.className = 'letter-box ' + entry.type + (changed ? ' flash' : '');
        letterBox.innerHTML = `${escapeHtml(entry.code)}<span class="type-tag">${typeLabel(entry.type)}</span>`;

        const body = document.createElement('div');
        body.className = 'strip-body';

        const meta = document.createElement('div');
        meta.className = 'strip-meta';
        meta.innerHTML = `<span>${typeLabel(entry.type)} · ${escapeHtml(group.icao)}</span><span>${timeAgo(entry.updated)}</span>`;
        body.appendChild(meta);

        if (changed) {
          const note = document.createElement('div');
          note.className = 'change-note';
          note.textContent = `was ${prevCode} → now ${entry.code}`;
          body.appendChild(note);
        }

        const text = document.createElement('div');
        text.className = 'strip-text';
        text.textContent = entry.text;
        body.appendChild(text);

        strip.appendChild(letterBox);
        strip.appendChild(body);
        card.appendChild(strip);

        prevCodes[key] = entry.code;
      }

      grid.appendChild(card);
    }
    savePrevCodes();
  }

  function renderFieldPanel(role, airport, atisMap, metarMap) {
    if (!airport || !airport.icao_code) {
      return `<div class="airport-card"><div class="airport-head"><span class="icao">${escapeHtml(role)}</span></div><div class="strip-body" style="padding:12px;color:var(--text-dim);">No ${escapeHtml(role.toLowerCase())} airport in flight plan.</div></div>`;
    }
    const icao = airport.icao_code;
    const entries = atisMap[icao] || [];
    const metar = metarMap[icao];
    let inner = '';
    if (entries.length) {
      entries.forEach(entry => {
        inner += `<div class="strip">
          <div class="letter-box ${entry.type}">${escapeHtml(entry.code)}<span class="type-tag">${typeLabel(entry.type)}</span></div>
          <div class="strip-body">
            <div class="strip-meta"><span>${typeLabel(entry.type)}</span><span>${timeAgo(entry.updated)}</span></div>
            <div class="strip-text">${escapeHtml(entry.text)}</div>
          </div>
        </div>`;
      });
    } else {
      inner += `<div class="strip-body" style="padding:12px;color:var(--text-dim);">No active D-ATIS for ${escapeHtml(icao)}.</div>`;
    }
    inner += `<div class="metar-block">METAR<div class="metar-text">${metar ? escapeHtml(metar) : 'Unavailable'}</div></div>`;
    return `<div class="airport-card">
      <div class="airport-head"><span class="icao">${escapeHtml(role)} · ${escapeHtml(icao)}</span><span class="count">${escapeHtml(airport.name || '')}</span></div>
      ${inner}
    </div>`;
  }

  function renderAirportDetail(data) {
    const { icao, entries, metarRaw, metar, runways, notams, controllers } = data;
    const content = document.getElementById('detailContent');
    let html = '<div class="detail-body">';

    html += '<div class="detail-panel"><h3>Current ATIS</h3>';
    if (entries.length) {
      entries.forEach(e => {
        html += `<div class="strip">
          <div class="letter-box ${e.type}">${escapeHtml(e.code)}<span class="type-tag">${typeLabel(e.type)}</span></div>
          <div class="strip-body">
            <div class="strip-meta"><span>${typeLabel(e.type)}</span><span>${timeAgo(e.updated)}</span></div>
            <div class="strip-text">${escapeHtml(e.text)}</div>
          </div>
        </div>`;
      });
    } else {
      html += `<div style="color:var(--text-dim);">No active D-ATIS for ${escapeHtml(icao)}.</div>`;
    }
    html += '</div>';

    html += '<div class="detail-panel"><h3>Weather</h3>';
    if (metar) {
      const catLabel = { vfr: 'VFR', mvfr: 'MVFR', ifr: 'IFR', lifr: 'LIFR', unknown: '—' }[metar.flightCategory];
      html += `<div class="wx-top">
        <span class="wx-badge ${metar.flightCategory}">${catLabel}</span>
        <div class="wind-compass-wrap">${windCompassSvg(metar)}
          <div>
            <div style="font-size:13px;">${metar.windVariable ? 'Variable' : (metar.windDir != null ? metar.windDir + '°' : '—')}</div>
            <div style="font-size:12px;color:var(--text-dim);">${metar.windSpeed != null ? metar.windSpeed + ' kt' : '—'}${metar.windGust ? ' G' + metar.windGust : ''}</div>
          </div>
        </div>
        <div class="wx-stats">
          <div class="item"><span class="label">Visibility</span><span class="value">${metar.visibilityRaw || '—'}</span></div>
          <div class="item"><span class="label">Temp / Dew</span><span class="value">${metar.tempC != null ? metar.tempC + '°C' : '—'} / ${metar.dewpointC != null ? metar.dewpointC + '°C' : '—'}</span></div>
          <div class="item"><span class="label">Altimeter</span><span class="value">${metar.altimeterInHg != null ? metar.altimeterInHg.toFixed(2) : (metar.altimeterQnh != null ? metar.altimeterQnh + ' hPa' : '—')}</span></div>
          <div class="item"><span class="label">Ceiling</span><span class="value">${metar.ceilingFt != null ? metar.ceilingFt + ' ft' : 'None'}</span></div>
        </div>
      </div>`;
      if (metar.weather.length) {
        html += '<div class="wx-chips">' + metar.weather.map(w => `<span class="chip">${escapeHtml(describeWx(w))}</span>`).join('') + '</div>';
      }
      html += '<div class="cloud-rows">';
      if (metar.skyClear || !metar.clouds.length) {
        html += '<div class="cloud-row">Sky clear</div>';
      } else {
        metar.clouds.forEach(c => {
          const pct = COVER_PCT[c.cover] || 50;
          html += `<div class="cloud-row"><span style="width:70px;">${c.cover}${c.modifier ? ' ' + c.modifier : ''}</span><div class="cloud-bar-track"><div class="cloud-bar-fill" style="width:${pct}%;"></div></div><span style="width:70px;text-align:right;">${c.heightFt} ft</span></div>`;
        });
      }
      html += '</div>';
      if (metarRaw) html += `<div style="margin-top:12px;font-size:11px;color:var(--text-dim);">${escapeHtml(metarRaw)}</div>`;
    } else {
      html += '<div style="color:var(--text-dim);">METAR unavailable.</div>';
    }
    html += '</div>';

    html += '<div class="detail-panel"><h3>Runways In Use (parsed from ATIS)</h3>';
    if (runways.arriving.length || runways.departing.length) {
      if (runways.arriving.length) html += `<div class="runway-group"><span class="glabel">Arriving</span>${runways.arriving.map(r => `<span class="chip">${escapeHtml(r)}</span>`).join('')}</div>`;
      if (runways.departing.length) html += `<div class="runway-group"><span class="glabel">Departing</span>${runways.departing.map(r => `<span class="chip">${escapeHtml(r)}</span>`).join('')}</div>`;
    } else {
      html += '<div style="color:var(--text-dim);">Not clearly stated in the current ATIS text.</div>';
    }
    html += '</div>';

    html += '<div class="detail-panel"><h3>NOTAM-style Remarks <span style="font-weight:normal;text-transform:none;letter-spacing:0;">(parsed from ATIS — not the official NOTAM feed)</span></h3>';
    if (notams.length) {
      html += '<div class="notam-list">' + notams.map(n => `<div class="notam-item"><span class="notam-dot ${n.severity}"></span><span>${escapeHtml(n.text)}</span></div>`).join('') + '</div>';
    } else {
      html += '<div style="color:var(--text-dim);">No remarks parsed from the current ATIS.</div>';
    }
    html += '</div>';

    html += '<div class="detail-panel"><h3>VATSIM Controllers Online</h3>';
    if (controllers.length) {
      html += controllers.map(c => `<div class="controller-row"><span><span class="controller-pos">${escapeHtml(CONTROLLER_LABELS[c.position] || c.position)}</span> · ${escapeHtml(c.name || '')}</span><span>${escapeHtml(c.freq || '')} · ${onlineDuration(c.logon)}</span></div>`).join('');
    } else {
      html += `<div style="color:var(--text-dim);">No VATSIM controllers currently online for ${escapeHtml(icao)}.</div>`;
    }
    html += '</div>';

    html += '</div>';
    content.innerHTML = html;
  }

  async function loadAirportDetail() {
    const icao = detailState.icao;
    if (!icao) return;
    const content = document.getElementById('detailContent');
    content.innerHTML = `<div class="empty-state">Loading ${escapeHtml(icao)}…</div>`;
    try {
      const [atisMap, metarMap, controllers] = await Promise.all([
        fetchAtisForIcaos([icao], settings.source),
        fetchMetar([icao]).catch(() => ({})),
        fetchVatsimControllers(icao).catch(() => [])
      ]);
      const entries = atisMap[icao] || [];
      const metarRaw = metarMap[icao] || '';
      const metar = parseMetar(metarRaw);
      const primaryAtisText = entries.map(e => e.text).join(' ');
      const runways = parseRunways(primaryAtisText);
      const notams = classifyNotams(primaryAtisText);
      renderAirportDetail({ icao, entries, metarRaw, metar, runways, notams, controllers });
    } catch (err) {
      console.error(err);
      content.innerHTML = `<div class="empty-state">Could not load details for ${escapeHtml(icao)}: ${escapeHtml(err.message)}</div>`;
    }
  }

  function openAirportDetail(icao) {
    detailState.icao = icao;
    document.getElementById('detailTitle').textContent = icao;
    document.getElementById('airportDetailOverlay').classList.add('show');
    loadAirportDetail();
  }

  function closeAirportDetail() {
    document.getElementById('airportDetailOverlay').classList.remove('show');
  }

  async function loadDashboard() {
    setStatus('Fetching ' + (settings.source === 'vatsim' ? 'VATSIM' : 'real-world') + ' data…');
    try {
      const entries = settings.source === 'vatsim' ? await fetchVatsim() : await fetchRealWorld();
      hideBanner();
      lastDashboardEntries = entries;
      render(entries);
      lastFetchAt = new Date();
      setStatus('Updated ' + lastFetchAt.toLocaleTimeString() + ' · source: ' + (settings.source === 'vatsim' ? 'VATSIM' : 'Real-world D-ATIS'));
    } catch (err) {
      console.error(err);
      showBanner(
        'Live feed unavailable (' + err.message + '). This is usually a CORS or network block. ' +
        'Showing sample strips. If this page is hosted and the live feed still fails, set a CORS proxy prefix in Settings.'
      );
      lastDashboardEntries = SAMPLE_DATA[settings.source] || [];
      render(lastDashboardEntries);
      setStatus('Showing sample data — live fetch failed');
    }
  }

  function renderSayIntentions(entries) {
    const grid = document.getElementById('siGrid');
    grid.innerHTML = '';
    if (!entries.length) {
      grid.innerHTML = '<div class="empty-state">Add airports in Settings to see SayIntentions ATC data for them.</div>';
      return;
    }
    const stars = starredSet();
    const sorted = [...entries].sort((a, b) => {
      const as = stars.has(a.icao.toUpperCase()) ? 0 : 1;
      const bs = stars.has(b.icao.toUpperCase()) ? 0 : 1;
      if (as !== bs) return as - bs;
      return a.icao.localeCompare(b.icao);
    });

    for (const entry of sorted) {
      const isStarred = stars.has(entry.icao.toUpperCase());
      const key = 'sayintentions|' + entry.icao;
      const prevCode = prevCodes[key];
      const changed = prevCode && entry.code !== '-' && prevCode !== entry.code;

      const card = document.createElement('div');
      card.className = 'airport-card';
      card.dataset.icao = entry.icao;

      const head = document.createElement('div');
      head.className = 'airport-head';
      head.innerHTML = `<span class="icao"><button class="star-btn ${isStarred ? 'active' : ''}" data-icao="${escapeHtml(entry.icao)}">${isStarred ? '★' : '☆'}</button>${escapeHtml(entry.icao)}</span><span class="count">AI ATC</span>`;
      card.appendChild(head);

      const strip = document.createElement('div');
      strip.className = 'strip clickable-strip';
      const letterBox = document.createElement('div');
      letterBox.className = 'letter-box ai' + (changed ? ' flash' : '');
      letterBox.innerHTML = `${escapeHtml(entry.code)}<span class="type-tag">AI ATC</span>`;
      const body = document.createElement('div');
      body.className = 'strip-body';
      const meta = document.createElement('div');
      meta.className = 'strip-meta';
      meta.innerHTML = `<span>SayIntentions · ${escapeHtml(entry.icao)}</span><span></span>`;
      body.appendChild(meta);
      if (changed) {
        const note = document.createElement('div');
        note.className = 'change-note';
        note.textContent = `was ${prevCode} → now ${entry.code}`;
        body.appendChild(note);
      }
      const text = document.createElement('div');
      text.className = 'strip-text';
      text.textContent = entry.atis || `No AI ATIS available for ${entry.icao}.`;
      body.appendChild(text);
      strip.appendChild(letterBox);
      strip.appendChild(body);
      card.appendChild(strip);
      prevCodes[key] = entry.code;

      if (entry.comms && entry.comms.length) {
        const commsBlock = document.createElement('div');
        commsBlock.className = 'metar-block';
        commsBlock.textContent = 'COMMS';
        const commsText = document.createElement('div');
        commsText.className = 'metar-text';
        commsText.textContent = entry.comms.map(c => `${c.type} ${c.freq}`).join(' · ');
        commsBlock.appendChild(commsText);
        card.appendChild(commsBlock);
      }

      const metarBlock = document.createElement('div');
      metarBlock.className = 'metar-block';
      metarBlock.textContent = 'METAR';
      const metarText = document.createElement('div');
      metarText.className = 'metar-text';
      metarText.textContent = entry.metar || 'Unavailable';
      metarBlock.appendChild(metarText);
      card.appendChild(metarBlock);

      if (entry.taf) {
        const tafBlock = document.createElement('div');
        tafBlock.className = 'metar-block';
        tafBlock.textContent = 'TAF';
        const tafText = document.createElement('div');
        tafText.className = 'metar-text';
        tafText.textContent = entry.taf;
        tafBlock.appendChild(tafText);
        card.appendChild(tafBlock);
      }

      grid.appendChild(card);
    }
    savePrevCodes();
  }

  async function loadSayIntentions() {
    const grid = document.getElementById('siGrid');
    const list = settings.airports || [];
    if (!settings.siApiKey) {
      hideBanner();
      grid.innerHTML = '<div class="empty-state">Set your SayIntentions Developer Key and API Key in Settings, then Refresh.</div>';
      setStatus('SayIntentions: no API key set');
      return;
    }
    if (!list.length) {
      grid.innerHTML = '<div class="empty-state">Add airports in Settings to see SayIntentions ATC data for them.</div>';
      setStatus('SayIntentions: no airports configured');
      return;
    }
    setStatus('Fetching SayIntentions AI ATC data…');
    try {
      const entries = await fetchSayIntentions(list);
      hideBanner();
      lastSiEntries = entries;
      renderSayIntentions(entries);
      setStatus('Updated ' + new Date().toLocaleTimeString() + ' · source: SayIntentions AI ATC');
    } catch (err) {
      console.error(err);
      showBanner('SayIntentions fetch failed (' + err.message + '). Check your Developer Key and API Key in Settings.');
      grid.innerHTML = '<div class="empty-state">Could not load SayIntentions data.</div>';
      setStatus('SayIntentions fetch failed');
    }
  }

  function updateFlightLabel() {
    const label = document.getElementById('flightUserLabel');
    label.textContent = settings.simbriefUser ? 'SimBrief: ' + settings.simbriefUser : 'No SimBrief username set';
  }

  async function loadFlight(forceRefetchPlan) {
    updateFlightLabel();
    const user = settings.simbriefUser.trim();
    const flightContent = document.getElementById('flightContent');
    if (!user) {
      flightContent.innerHTML = '<div class="empty-state">Set your SimBrief username in Settings, then click Load Flight.</div>';
      return;
    }
    if (forceRefetchPlan || !flightState.data) {
      flightContent.innerHTML = '<div class="empty-state">Loading flight plan…</div>';
    }
    try {
      if (forceRefetchPlan || !flightState.data) {
        flightState.data = await fetchSimbrief(user);
      }
      const d = flightState.data;
      const origin = d.origin || {};
      const destination = d.destination || {};
      const alternate = d.alternate || {};
      const icaos = [origin.icao_code, destination.icao_code, alternate.icao_code].filter(Boolean);

      const [atisMap, metarMap] = await Promise.all([
        fetchAtisForIcaos(icaos, settings.source),
        fetchMetar(icaos).catch(() => ({}))
      ]);

      const general = d.general || {};
      const aircraft = d.aircraft || {};
      const times = d.times || {};
      const callsign = (general.icao_airline || '') + (general.flight_number || '');
      const aircraftStr = [aircraft.icao_code, aircraft.reg ? '(' + aircraft.reg + ')' : ''].filter(Boolean).join(' ');

      let html = '';
      html += `<div class="flight-summary">
        <div class="item"><span class="label">Callsign</span><span class="value">${escapeHtml(callsign || '—')}</span></div>
        <div class="item"><span class="label">Aircraft</span><span class="value">${escapeHtml(aircraftStr || '—')}</span></div>
        <div class="item"><span class="label">Route</span><span class="value">${escapeHtml(general.route || '—')}</span></div>
        <div class="item"><span class="label">Sched Out / In</span><span class="value">${formatZulu(times.sched_out)} / ${formatZulu(times.sched_in)}</span></div>
      </div>`;
      html += '<div class="grid">';
      html += renderFieldPanel('DEPARTURE', origin, atisMap, metarMap);
      html += renderFieldPanel('ARRIVAL', destination, atisMap, metarMap);
      html += renderFieldPanel('ALTERNATE', alternate, atisMap, metarMap);
      html += '</div>';
      flightContent.innerHTML = html;
    } catch (err) {
      console.error(err);
      flightContent.innerHTML = `<div class="empty-state">Could not load flight: ${escapeHtml(err.message)}. Check the username in Settings, or file a flight at simbrief.com.</div>`;
    }
  }

  function tick() {
    if (settings.view === 'flight') loadFlight(false);
    else if (settings.view === 'sayintentions') loadSayIntentions();
    else loadDashboard();
  }

  function restartTimer() {
    if (timer) clearInterval(timer);
    const interval = settings.view === 'sayintentions'
      ? SAYINTENTIONS_INTERVAL
      : (settings.source === 'vatsim' ? VATSIM_INTERVAL : REALWORLD_INTERVAL);
    timer = setInterval(tick, interval);
  }

  function applySourceButtons() {
    document.querySelectorAll('#sourceToggle button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.source === settings.source);
    });
  }

  function applyViewButtons() {
    document.querySelectorAll('#viewToggle button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.view === settings.view);
    });
  }

  function showActiveView() {
    document.getElementById('dashboardSection').classList.toggle('hidden', settings.view !== 'dashboard');
    document.getElementById('flightSection').classList.toggle('hidden', settings.view !== 'flight');
    document.getElementById('sayintentionsSection').classList.toggle('hidden', settings.view !== 'sayintentions');
    document.getElementById('sourceToggle').classList.toggle('hidden', settings.view === 'sayintentions');
    if (settings.view !== 'dashboard') hideBanner();
  }

  document.getElementById('viewToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    settings.view = btn.dataset.view;
    saveSettings();
    applyViewButtons();
    showActiveView();
    tick();
    restartTimer();
  });

  document.getElementById('sourceToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    settings.source = btn.dataset.source;
    saveSettings();
    applySourceButtons();
    tick();
    restartTimer();
  });

  function handleStarClick(e, kind) {
    const btn = e.target.closest('.star-btn');
    if (!btn) return;
    const icao = btn.dataset.icao.toUpperCase();
    const idx = settings.starred.findIndex(s => s.toUpperCase() === icao);
    if (idx >= 0) settings.starred.splice(idx, 1);
    else settings.starred.push(icao);
    saveSettings();
    if (kind === 'dashboard') render(lastDashboardEntries);
    else renderSayIntentions(lastSiEntries);
  }

  document.getElementById('grid').addEventListener('click', (e) => handleStarClick(e, 'dashboard'));
  document.getElementById('siGrid').addEventListener('click', (e) => handleStarClick(e, 'sayintentions'));

  function handleStripClick(e) {
    if (e.target.closest('.star-btn')) return;
    if (window.getSelection && String(window.getSelection()).length > 0) return;
    const strip = e.target.closest('.clickable-strip');
    if (!strip) return;
    const card = e.target.closest('.airport-card');
    if (card && card.dataset.icao) openAirportDetail(card.dataset.icao);
  }

  document.getElementById('grid').addEventListener('click', handleStripClick);
  document.getElementById('siGrid').addEventListener('click', handleStripClick);
  document.getElementById('detailBackBtn').addEventListener('click', closeAirportDetail);
  document.getElementById('detailRefreshBtn').addEventListener('click', loadAirportDetail);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.getElementById('airportDetailOverlay').classList.contains('show')) closeAirportDetail();
  });

  document.getElementById('settingsBtn').addEventListener('click', () => {
    const panel = document.getElementById('settingsPanel');
    document.getElementById('airportInput').value = settings.airports.join(', ');
    document.getElementById('starredInput').value = settings.starred.join(', ');
    document.getElementById('showAllInput').checked = settings.showAll;
    document.getElementById('simbriefInput').value = settings.simbriefUser;
    document.getElementById('proxyInput').value = settings.proxy;
    document.getElementById('siDevKeyInput').value = settings.siDevKey;
    document.getElementById('siApiKeyInput').value = settings.siApiKey;
    document.getElementById('lookupResult').innerHTML = '';
    panel.classList.toggle('show');
  });

  document.getElementById('saveSettingsBtn').addEventListener('click', () => {
    settings.airports = document.getElementById('airportInput').value.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
    settings.starred = document.getElementById('starredInput').value.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
    settings.showAll = document.getElementById('showAllInput').checked;
    settings.simbriefUser = document.getElementById('simbriefInput').value.trim();
    settings.proxy = document.getElementById('proxyInput').value.trim();
    settings.siDevKey = document.getElementById('siDevKeyInput').value.trim();
    settings.siApiKey = document.getElementById('siApiKeyInput').value.trim();
    saveSettings();
    restartTimer();
    document.getElementById('settingsPanel').classList.remove('show');
    updateFlightLabel();
    tick();
  });

  async function runLookup() {
    const icao = document.getElementById('lookupInput').value.trim().toUpperCase();
    const resultEl = document.getElementById('lookupResult');
    if (!icao) { resultEl.innerHTML = ''; return; }
    resultEl.innerHTML = `<div class="empty-state" style="padding:16px;">Looking up ${escapeHtml(icao)}…</div>`;
    try {
      const [atisMap, metarMap] = await Promise.all([
        fetchAtisForIcaos([icao], settings.source),
        fetchMetar([icao]).catch(() => ({}))
      ]);
      resultEl.innerHTML = renderFieldPanel('LOOKUP', { icao_code: icao, name: '' }, atisMap, metarMap);
    } catch (err) {
      resultEl.innerHTML = `<div class="empty-state" style="padding:16px;">Lookup failed: ${escapeHtml(err.message)}</div>`;
    }
  }

  document.getElementById('lookupBtn').addEventListener('click', runLookup);
  document.getElementById('lookupInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); runLookup(); }
  });

  document.getElementById('loadFlightBtn').addEventListener('click', () => loadFlight(true));
  document.getElementById('refreshBtn').addEventListener('click', tick);
  document.getElementById('manualRefresh').addEventListener('click', tick);

  applySourceButtons();
  applyViewButtons();
  showActiveView();
  updateFlightLabel();
  tick();
  restartTimer();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((e) => console.error('SW register failed', e));
    });
  }
})();
</script>
</body>
</html>
